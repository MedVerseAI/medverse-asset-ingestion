# Profile: quest3_lod0  (Meta Quest 3 VR target: strictly < 180,000 triangles + consolidated materials)
#   Brainnetome  owns : cortical regions, subcortical regions (all 246 atlas regions)
#   BodyParts3D  owns : cerebellum, brainstem, spinal cord, vertebral column, discs, non-duplicated brain structures
# Enforces a global scene triangle ceiling (165,000 target < 180,000 hard cap) and lobe/group palette materials
# so standalone Meta Quest 3 hits 72-90 FPS with minimal draw calls while keeping every mesh individually selectable.

[anatomy.brain]
include_ventricular_system = true
include_cerebral_white_matter = true
include_cranial_nerves = false

[anatomy.spine]
include_vertebrae = true
include_intervertebral_discs = true
include_spinal_cord = true

[sources.brainnetome]
cortical_max_id = 210

[geometry]
decimate_volumes = true
scene_triangle_budget = 165000
min_faces_per_mesh = 80
decimation_aggressiveness = 7
max_bbox_drift_mm = 2.5
require_simplification = true

[geometry.face_budget]
VERTEBRAE = 1200
INTERVERTEBRAL_DISCS = 500
SPINAL_CORD = 1500
CEREBELLUM = 6000
BRAINSTEM = 1500
SUBCORTICAL_STRUCTURES = 500
OTHER_BRAIN_STRUCTURES = 1200
CRANIAL_NERVES = 400
CEREBRAL_CORTEX = 450

[registration]
moving_source = "bodyparts3d"
allow_scale = false

[scene]
material_mode = "lobe_palette"

[export.blend]
enabled = true
filename = "anatomical_model_quest3_lod0.blend"

[export.fbx]
enabled = true
filename = "anatomical_model_quest3_lod0.fbx"

[export.glb]
enabled = true
filename = "anatomical_model_quest3_lod0.glb"
draco_compression = true
draco_level = 6
export_extras = true
verify_reimport = true

# --- targets: first matching target of a category wins ----------------------------------------------------
[[profile.targets]]
name = "cerebral_cortex"
categories = ["cerebral_cortex"]
owner = "brainnetome"
fallback_owner = "bodyparts3d"
group = "CEREBRAL_CORTEX"
system = "BRAIN"
collection = "CEREBRAL_CORTEX"
reference_for_registration = true

[[profile.targets]]
name = "subcortical_atlas_regions"
categories = ["hippocampus", "amygdala", "basal_ganglia", "thalamus"]
owner = "brainnetome"
fallback_owner = "bodyparts3d"
group = "SUBCORTICAL_STRUCTURES"
system = "BRAIN"
collection = "SUBCORTICAL_STRUCTURES"
reference_for_registration = true

[[profile.targets]]
name = "diencephalon_and_other_deep_gray"
categories = ["deep_gray_other"]
owner = "bodyparts3d"
group = "SUBCORTICAL_STRUCTURES"
system = "BRAIN"
collection = "SUBCORTICAL_STRUCTURES"

[[profile.targets]]
name = "cerebellum"
categories = ["cerebellum"]
owner = "bodyparts3d"
group = "CEREBELLUM"
system = "BRAIN"
collection = "CEREBELLUM"

[[profile.targets]]
name = "brainstem"
categories = ["brainstem"]
owner = "bodyparts3d"
group = "BRAINSTEM"
system = "BRAIN"
collection = "BRAINSTEM"

[[profile.targets]]
name = "ventricular_system"
categories = ["ventricular_system"]
owner = "bodyparts3d"
group = "OTHER_BRAIN_STRUCTURES"
system = "BRAIN"
collection = "OTHER_BRAIN_STRUCTURES"
enabled_by = "anatomy.brain.include_ventricular_system"

[[profile.targets]]
name = "white_matter"
categories = ["white_matter"]
owner = "bodyparts3d"
